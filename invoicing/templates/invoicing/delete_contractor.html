{% extends 'invoicing/base.html' %}
{% block content %}
<h2>Удалить контрагента: {{ contractor.name }}?</h2>
<p>Это действие нельзя отменить. Удалить?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
</form>
<a href="{% url 'contractors_dashboard' %}" class="btn btn-secondary">Отмена</a>
{% endblock %}
