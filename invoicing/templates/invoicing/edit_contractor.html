{% extends 'invoicing/base.html' %}
{% block content %}
<h2>Редактировать контрагента: {{ form.instance.name }}</h2>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success">Сохранить изменения</button>
</form>
<a href="{% url 'contractors_dashboard' %}" class="btn btn-secondary">Отмена</a>
{% endblock %}
